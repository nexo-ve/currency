<!DOCTYPE html>
<!--
  Fixture reproducing the exact structure of http://www.bcv.org.ve/ that the
  BCV scraper relies on. Values are fixed so tests can assert on them.
  Structure mirrors the live page: div[@id='<currency>']/div/div/div[2]/strong
  Every quote is "VES per 1 unit of the foreign currency".
-->
<html lang="es">
  <body>
    <div id="rate-container">
      <div id="euro" class="col-sm-12 col-xs-12 ">
        <div class="field-content">
          <div class="row recuadrotsmc">
            <div class="col-sm-6 col-xs-6">
              <img src="/sites/default/files/euro-04_2.png" class="icono_bss_blanco1"/>
              <span> EUR </span>
            </div>
            <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb"> 906,83255816</strong> </div>
          </div>
        </div>
      </div>
      <div id="yuan" class="col-sm-12 col-xs-12 ">
        <div class="field-content">
          <div class="row recuadrotsmc">

              <img src="/sites/default/files/yuan-04_2.png" class="icono_bss_blanco1"/>
              <span> CNY </span>
            </div>
            <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb"> 115,54420878</strong> </div>
          </div>
        </div>
      </div>
      <div id="lira" class="col-sm-12 col-xs-12 ">
        <div class="field-content">
          <div class="row recuadrotsmc">

            <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb">16,42292139</strong> </div>

        </div>
      </div>
      <div id="rublo" class="col-sm-12 col-xs-12 ">

          <div class="row recuadrotsmc">

              <span> RUB </span>
            </div>
            <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb"> 9,15253237</strong> </div>

        </div>
      </div>
      <div id="dolar" class="col-sm-12 col-xs-12 ">

    </div>

</html>
